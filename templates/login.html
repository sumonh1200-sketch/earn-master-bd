
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>লগইন - Earn Master BD</title>
</head>
<body>
    <h2>অ্যাকাউন্টে লগইন করুন</h2>

    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
    {% endwith %}

    <form method="POST">
        <input name="username" placeholder="ইউজারনেম" required>
        <br><br>
        <input name="password" type="password" placeholder="পাসওয়ার্ড" required>
        <br><br>
        <button type="submit">লগইন</button>
    </form>

    <p><a href="/register">নতুন অ্যাকাউন্ট খুলুন</a></p>
</body>
</html>
